# Publishes a GitHub release whenever main has a version in package.json that isn't released yet:
# builds the Mac app for Apple silicon and Intel with its own ffmpeg (compiled here from pinned
# sources), checks it, wraps it in a disk image, attests where it came from, and attaches it all.
#
# To release: bump "version" in package.json (npm version 1.2.3 --no-git-tag-version) and push to main.
# Pull requests that change the release tooling get a full dry run that builds but doesn't publish.
# See docs/releasing.md. Same conventions as ci.yml (pinned actions, read-only tokens by default),
# plus no build caches anywhere, so nothing from another run can end up inside a published app.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/build_ffmpeg.sh
      - tools/make_dmg.mjs
      - tools/package.mjs
      - tools/verify_package.mjs
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  NPM_CONFIG_FUND: 'false'

jobs:
  plan:
    name: Is there a new version to release?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare package.json with the released versions
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ]; then
            echo "Dry run: build only."
            build=true; publish=false
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released. Bump the version in package.json to release again."
            build=false; publish=false
          else
            echo "v$version isn't released yet: building and publishing it."
            build=true; publish=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            label: Apple silicon
          - runner: macos-15-intel
            arch: x64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install build tools
        run: brew install nasm pkgconf

      - name: Build ffmpeg from pinned, checksummed sources
        run: bash tools/build_ffmpeg.sh

      - name: Use that ffmpeg for everything below
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "$GITHUB_WORKSPACE/vendor/darwin-$ARCH/ffmpeg" >> "$GITHUB_PATH"

      - name: Install npm packages
        run: npm ci

      - name: Render the built-in themes (Halloween; themes without generated media skip)
        env:
          CRYSTAL_BALL_DATA_DIR: ${{ runner.temp }}/data-themes
        run: npm run themes

      - name: Tests
        run: npm test

      - name: Package with the bundled ffmpeg
        run: npm run package

      - name: Check the app (allowlist, bundled ffmpeg, fuses, signature)
        run: npm run package:verify -- --require-ffmpeg

      - name: The packaged app starts and keeps running
        env:
          CRYSTAL_BALL_DATA_DIR: ${{ runner.temp }}/data-packaged
          ARCH: ${{ matrix.arch }}
        run: |
          "dist/Crystal Ball Themes-darwin-$ARCH/Crystal Ball Themes.app/Contents/MacOS/Crystal Ball Themes" &
          pid=$!
          sleep 20
          kill -0 "$pid"
          kill "$pid"

      - name: Disk image
        run: npm run dmg

      - name: Keep the disk image for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Keep the ffmpeg sources (the GPL asks for them to ship with the binaries)
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-sources
          path: vendor/ffmpeg-sources.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the build provenance with Sigstore
      attestations: write # store the provenance with the repository
    steps:
      - name: Collect the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: shasum -a 256 -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.dmg
            assets/ffmpeg-sources.tar

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "assets/crystal-ball-themes-v$VERSION.sigstore.json"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          cat > notes.md <<EOF
          ## Download

          | Your Mac | Download |
          | --- | --- |
          | Apple chip (M1, M2, M3, M4 and later) | [Crystal-Ball-Themes-mac-apple-silicon.dmg]($base/Crystal-Ball-Themes-mac-apple-silicon.dmg) |
          | Intel processor | [Crystal-Ball-Themes-mac-intel.dmg]($base/Crystal-Ball-Themes-mac-intel.dmg) |

          Needs macOS 12 or newer. Not sure which Mac you have? Apple menu > About This Mac.

          1. Open the download and drag **Crystal Ball Themes** into **Applications**.
          2. Open it. The first time, macOS says it can't check the app: click **Done**, then go to
             **System Settings > Privacy & Security**, scroll down and click **Open Anyway**. Only once.
          3. Turn the ball off, plug it into the Mac, and hold the middle button until a USB picture shows.
          4. Pick a theme and press **Show on the ball**.

          Comes with the Halloween theme; drag in your own videos, GIFs or photos to make more.

          ## Checking the download

          Built in public by GitHub Actions from the tagged commit. \`SHA256SUMS.txt\` lists checksums,
          and the build provenance can be verified with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          The app includes FFmpeg (GPL v2 or later) built from source; \`ffmpeg-sources.tar\` holds the exact
          sources and build script.
          EOF
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Crystal Ball Themes $VERSION" --notes-file notes.md --generate-notes \
            --draft
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
